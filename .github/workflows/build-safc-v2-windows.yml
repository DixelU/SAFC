name: SAF-C v2 Windows build (manual)

# GitHub only exposes workflow_dispatch when this file exists on the default
# branch (master). The checked-out application sources are always from develop.
on:
  workflow_dispatch:

permissions:
  contents: read

# Queue manual builds rather than cancelling a long dependency compilation.
concurrency:
  group: safc-v2-windows-manual
  cancel-in-progress: false

jobs:
  build:
    name: x64 Release (develop)
    runs-on: windows-2025-vs2026
    timeout-minutes: 360
    env:
      VCPKG_DEFAULT_BINARY_CACHE: \${{ runner.temp }}\vcpkg-binary-cache
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out develop and recursive submodules
        uses: actions/checkout@v4
        with:
          ref: develop
          submodules: recursive
          persist-credentials: false

      - name: Restore compiled vcpkg packages
        uses: actions/cache@v4
        with:
          path: \${{ runner.temp }}\vcpkg-binary-cache
          key: safc-v2-vs2026-x64-vcpkg-\${{ hashFiles('dependencies.txt') }}-v1
          restore-keys: |
            safc-v2-vs2026-x64-vcpkg-

      - name: Install static x64 dependencies
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw 'This runner does not provide VCPKG_INSTALLATION_ROOT.'
          }
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          if (-not (Test-Path -LiteralPath $vcpkg -PathType Leaf)) {
            throw "vcpkg.exe not found at $vcpkg"
          }
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          # Install the ImGui frontend's Boost modules, not the full Boost meta-package;
          # the legacy GUI's freeglut dependency is also intentionally omitted.
          & $vcpkg install `
            'boost-algorithm:x64-windows-static' `
            'boost-container:x64-windows-static' `
            'libarchive[core,bzip2,lz4,lzma,xar,zstd]:x64-windows-static' `
            'zstd:x64-windows-static' `
            'glfw3:x64-windows-static' `
            'imgui[glfw-binding,opengl3-binding]:x64-windows-static'
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed (exit code $LASTEXITCODE)." }
          & $vcpkg integrate install
          if ($LASTEXITCODE -ne 0) { throw "vcpkg integration failed (exit code $LASTEXITCODE)." }

      - name: Build SAFC2 with MSVC v145
        run: |
          $vswhere = Join-Path \${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw 'Visual Studio vswhere.exe was not found.'
          }
          $vsPath = (& $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -property installationPath | Select-Object -First 1)
          if (-not $vsPath) { throw 'Visual Studio with MSBuild is not installed.' }
          $msbuild = Join-Path $vsPath 'MSBuild\Current\Bin\MSBuild.exe'
          if (-not (Test-Path -LiteralPath $msbuild -PathType Leaf)) {
            throw "MSBuild.exe not found at $msbuild"
          }
          & $msbuild '_SAFC_\imgui\SAFC2.vcxproj' `
            /p:Configuration=Release /p:Platform=x64 `
            "/p:VcpkgRoot=$env:VCPKG_INSTALLATION_ROOT" `
            /m:2 /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) { throw "SAFC2 build failed (exit code $LASTEXITCODE)." }

      - name: Assemble build artifact
        run: |
          $exe = 'build\msbuild\x64\Release\SAFC2\SAFC.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Expected SAFC v2 executable not found: $exe"
          }
          $out = 'dist\SAFC-v2-develop-x64'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -LiteralPath $exe -Destination (Join-Path $out 'SAFC.exe')
          $revision = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot determine checked-out source revision.' }
          $sha256 = (Get-FileHash -LiteralPath (Join-Path $out 'SAFC.exe') -Algorithm SHA256).Hash
          @(
            'Repository: DixelU/SAFC'
            'Source branch: develop'
            "Source commit: $revision"
            'Build: x64 Release, MSVC v145, static vcpkg dependencies'
            "SAFC.exe SHA-256: $sha256"
          ) | Set-Content -LiteralPath (Join-Path $out 'BUILD-INFO.txt') -Encoding utf8
          Get-Item -LiteralPath (Join-Path $out 'SAFC.exe') | Select-Object Name, Length
          Write-Host "Source revision: $revision"
          Write-Host "SHA-256: $sha256"

      - name: Upload SAF-C v2 executable
        uses: actions/upload-artifact@v4
        with:
          name: SAFC-v2-develop-x64-${{ github.run_number }}
          path: dist/SAFC-v2-develop-x64/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
